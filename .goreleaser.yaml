version: 2

builds:
  - flags:
      - -trimpath
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - dragonfly
      - freebsd
      - linux
      - netbsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - ppc64le
      - riscv64
      - s390x

archives:
  - formats: [tar.zst]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - AUTHORS.adoc
      - BUILD.adoc
      - CHANGELOG.adoc
      - CONTRIBUTING.adoc
      - LICENSES/*
      - README.md

checksum:
  name_template: "b2sums.txt"
  algorithm: blake2b

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
